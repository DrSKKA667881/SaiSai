<!DOCTYPE html>
<html lang="en"><head><meta name="format-detection" content="telephone=no,date=no,address=no,email=no"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard - Pet World Vet Clinic (Ahlone)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="preconnect" href="https://cdnjs.cloudflare.com"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
<style>
/* ===== PW-SHARED:BEGIN css (copy unchanged into every page; page-specific CSS goes AFTER the PW-SHARED:END marker) ===== */
/* Pet World Vet Clinic - shared style (from v19). Font: Plus Jakarta Sans + Myanmar fallbacks */

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d1b2a;
  --sidebar:#112031;
  --card:#152c42;
  --card2:#1a3550;
  --teal:#00c9a7;
  --teal2:#00a087;
  --blue:#0ea5e9;
  --text:#e2f0fb;
  --text2:#7bacc4;
  --text3:#3d6a8a;
  --border:rgba(255,255,255,0.07);
  --sw:218px;
  --radius:12px;
}

/* ── LIGHT MODE ── */
body.light{
  --bg:#f0f4f8;
  --sidebar:#ffffff;
  --card:#ffffff;
  --card2:#f1f5f9;
  --teal:#009e82;
  --teal2:#007a65;
  --blue:#0284c7;
  --text:#0f172a;
  --text2:#374151;
  --text3:#6b7280;
  --border:rgba(0,0,0,0.10);
}
body.light .sc,body.light .cd,body.light .modal{box-shadow:0 2px 10px rgba(0,0,0,.08);}
body.light .rb.lo{background:#e5e7eb;}
body.light .wk-bar-base{background:#e5e7eb;}
body.light .wk-col:not(.today) .wk-day{color:#374151;}
body.light .wk-col:not(.today) .wk-date{color:#9ca3af;}
body.light .tbl tr:hover{background:rgba(0,0,0,.02);}
body.light .tbl td,body.light .tbl th{color:var(--text);border-bottom-color:#e5e7eb;}
body.light .btn-ghost{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light .btn-ghost:hover{background:#e5e7eb;}
body.light .tb-btn{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light .icon-btn{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light .cqb{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light input,body.light select,body.light textarea{background:#ffffff;border-color:#d1d5db;color:#0f172a;}
body.light input::placeholder,body.light textarea::placeholder{color:#9ca3af;}
body.light input:focus,body.light select:focus,body.light textarea:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(0,158,130,.1);}
body.light .sb-box{background:#f8fafc;border-color:#d1d5db;}
body.light .sb-box input{background:transparent;color:#0f172a;}
body.light .form-g label{color:#374151;}
body.light .sb{background:#ffffff;border-right-color:#e5e7eb;}
body.light .sb-lbl{color:#9ca3af;}
body.light .ni{color:#374151;}
body.light .ni:hover{background:#f1f5f9;color:#0f172a;}
body.light .ni.on{background:linear-gradient(90deg,rgba(0,158,130,.12),rgba(2,132,199,.06));color:var(--teal);border-color:rgba(0,158,130,.25);}
body.light .topbar{background:#ffffff;border-bottom-color:#e5e7eb;}
body.light .topbar h1{color:#0f172a;}
body.light .theme-toggle{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light .cd-h{border-bottom-color:#e5e7eb;}
body.light .cd-h h3{color:#0f172a;}
body.light .cd-h a{color:var(--teal);}
body.light .badge{color:#374151;}
body.light .badge.b-done{background:rgba(0,158,130,.12);color:#065f46;}
body.light .badge.b-critical{background:rgba(239,68,68,.1);color:#b91c1c;}
body.light .badge.b-pending{background:rgba(245,158,11,.12);color:#92400e;}
body.light .badge.b-confirmed{background:rgba(14,165,233,.12);color:#0369a1;}
body.light .badge.b-low{background:rgba(245,158,11,.12);color:#92400e;}
/* Treatment cards */
body.light .tx-card{background:#ffffff;border-color:#e5e7eb;}
body.light .tx-diag{color:#0f172a !important;}
body.light .tx-date-badge{background:rgba(0,158,130,.08);border-color:rgba(0,158,130,.2);color:#065f46;}
body.light .tx-inj-label{color:#4338ca;}
body.light .tx-med-label{color:#065f46;}
body.light .tx-section-label{color:#374151 !important;}
body.light .tx-inj-pill{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.2);color:#4338ca;}
body.light .tx-med-pill{background:rgba(0,158,130,.08);border-color:rgba(0,158,130,.2);color:#065f46;}
body.light .tx-followup{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.2);}
body.light .tx-followup-title{color:#b45309;}
body.light .tx-note{color:#374151;border-top-color:#e5e7eb;}
body.light .tx-pill b{color:inherit;}
body.light .icon-btn{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light .icon-btn:hover{background:#e5e7eb;}
body.light .icon-btn.del{color:#dc2626;}
body.light #medPanel > div > div{background:#f8fafc;}
body.light #medPanel > div > div .mht{color:#374151;}
body.light .mht:hover:not(.on){background:rgba(0,0,0,.04);color:var(--text);}
body.light #medPanel > div > div .mht.on{background:#ffffff;color:var(--teal);border-color:#e5e7eb;}
body.light .med-empty{color:#6b7280;}
/* Autocomplete */
body.light #ci-name-drop,body.light #epi-name-drop{background:#ffffff;border-color:var(--teal);box-shadow:0 8px 20px rgba(0,0,0,.1);}
body.light #ci-name-drop > div,body.light #epi-name-drop > div{border-bottom-color:#f1f5f9 !important;}
body.light #ci-name-drop > div:hover,body.light #epi-name-drop > div:hover{background:rgba(0,158,130,.06) !important;}
/* Autocomplete text */
body.light #ci-name-drop > div div:first-child,body.light #epi-name-drop > div div:first-child{color:#0f172a !important;}
body.light #ci-name-drop > div div:last-child,body.light #epi-name-drop > div div:last-child{color:#374151 !important;}
/* POS */
body.light .pos-tab{color:#374151;}
body.light .pos-tab.on{background:#f8fafc;color:var(--teal);border-color:#e5e7eb;}
body.light .pos-item{background:#f8fafc;border-color:#e5e7eb;}
body.light .pos-item:hover{background:#f0fdf9;border-color:var(--teal);}
body.light .pos-item .pn{color:#0f172a;}
body.light .cart-name{color:#0f172a !important;}
body.light .pay-method{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light .pay-method.on{background:rgba(0,158,130,.1);border-color:var(--teal);color:var(--teal);}
body.light .ci-tag{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light .ci-tag.on{background:rgba(0,158,130,.08);border-color:var(--teal);color:var(--teal);}
body.light .emoji-pick{background:#f1f5f9;}
/* Tabs */
body.light .ft{color:#374151;border-color:#d1d5db;background:#f8fafc;}
body.light .ft.on{background:rgba(0,158,130,.1);border-color:var(--teal);color:var(--teal);}
/* Login */
body.light .login-box{background:#ffffff;border-color:#e5e7eb;}
body.light .login-box h2{color:#0f172a;}
body.light .role-chip{background:#f1f5f9;border-color:#d1d5db;color:#374151;}
body.light .role-chip.sel{background:rgba(0,158,130,.12);border-color:var(--teal);color:var(--teal);}
/* Modals */
body.light .modal{background:#ffffff;border-color:#e5e7eb;}
body.light .m-hdr{border-bottom-color:#e5e7eb;}
body.light .m-hdr h3{color:#0f172a;}
body.light .m-foot{border-top-color:#e5e7eb;background:#f8fafc;}
body.light .m-close{border-color:#d1d5db;color:#374151;}
/* SOP */
body.light .sop-card{background:#ffffff;border-color:#e5e7eb;}
body.light .sop-hdr:hover{background:#f8fafc;}
body.light .sop-hdr h4{color:#0f172a;}
body.light .sop-step p{color:#374151;}
/* Sidebar footer */
body.light .sb-foot{border-top-color:#e5e7eb;}
body.light .un{color:#0f172a;}
body.light .ur{color:#6b7280;}
/* Theme toggle button */
.theme-toggle{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0;
}
.theme-toggle:hover{border-color:var(--teal);}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:2px;}
::-webkit-scrollbar-track{background:transparent;}

/* ── SIDEBAR ── */
.sb{width:var(--sw);min-width:var(--sw);background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:300;}
.sb{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.sb>*{flex-shrink:0;}
.sb-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;}
.sb-logo .ico{width:40px;height:40px;border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-logo .ico img{width:100%;height:100%;object-fit:cover;}
.sb-logo .brand{font-size:14px;font-weight:800;line-height:1.25;}
.sb-logo .sub{font-size:10px;color:var(--teal);letter-spacing:.5px;font-weight:500;}
.sb-section{padding:14px 10px 0;}
.sb-lbl{font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:0 8px;margin-bottom:7px;font-weight:700;}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;transition:all .2s;margin-bottom:2px;color:var(--text2);font-size:13px;font-weight:500;}
.ni:hover{background:var(--card);color:var(--text);}
.ni.on{background:linear-gradient(90deg,rgba(0,201,167,.18),rgba(14,165,233,.08));color:var(--teal);border:1px solid rgba(0,201,167,.2);}
.ni i{width:20px;text-align:center;font-size:15px;font-style:normal;font-family:'Font Awesome 6 Free';font-weight:900;flex-shrink:0;}
.sb-grp-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-radius:8px;user-select:none;transition:color .15s}
.sb-grp-hd:hover{color:var(--text2)}
.sb-grp-hd .chev{margin-left:auto;font-size:11px;transition:transform .2s}
.sb-grp.closed .chev{transform:rotate(-90deg)}
.sb-grp.closed .sb-grp-body{display:none}
.sb-grp-body{padding-left:6px;border-left:1px solid var(--border);margin-left:18px}
.sb-grp-body .ni{margin-left:0}
.sb-sep{height:1px;background:var(--border);margin:10px 8px}
body.light .sb-grp-hd{color:#9ca3af}
.ni-ico{width:22px;text-align:center;font-size:16px;flex-shrink:0;display:inline-block;}
.ni .nb{margin-left:auto;background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;}
.sb-foot{margin-top:auto;padding:14px;border-top:1px solid var(--border);}
.ua{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:all .2s;}
.ua:hover{background:var(--card);}
.av{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.av.green{background:linear-gradient(135deg,var(--teal),#0ea5e9);}
.av.purple{background:linear-gradient(135deg,#7c3aed,#db2777);}
.un{font-size:12px;font-weight:700;}
.ur{font-size:10px;color:var(--teal);}
.lo-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--text3);font-size:12px;margin-top:3px;transition:all .2s;}
.lo-btn:hover{background:rgba(239,68,68,.1);color:#f87171;}

/* ── MAIN ── */
.main{margin-left:var(--sw);flex:1;min-width:0;display:flex;flex-direction:column;}

/* ── TOPBAR ── */
.topbar{background:var(--sidebar);border-bottom:1px solid var(--border);height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:100;}
.tb-left h1{font-size:19px;font-weight:800;}
.tb-left p{font-size:11px;color:var(--text2);margin-top:1px;}
.tb-right{display:flex;align-items:center;gap:10px;}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 13px;width:230px;}
.srch input{background:none;border:none;outline:none;color:var(--text);font-size:12px;font-family:inherit;width:100%;}
.srch input::placeholder{color:var(--text3);}
.srch i{color:var(--text3);font-size:12px;}
.tb-btn{width:37px;height:37px;border-radius:9px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:13px;transition:all .2s;position:relative;}
.tb-btn:hover{background:var(--card2);color:var(--text);}
.nd{position:absolute;top:7px;right:7px;width:7px;height:7px;background:#ef4444;border-radius:50%;border:2px solid var(--sidebar);}
.welcome{background:linear-gradient(135deg,var(--teal),#0ea5e9);color:#fff;padding:8px 15px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}

/* ── CONTENT ── */
.content{padding:24px;flex:1;overflow-y:auto;}
.page{display:none;animation:fadeIn .3s ease;}
.page.on{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── STAT CARDS ── */
.sg{display:grid;gap:14px;margin-bottom:20px;}
.sg4{grid-template-columns:repeat(4,1fr);}
.sg3{grid-template-columns:repeat(3,1fr);}
.sg2{grid-template-columns:1fr 1fr;}
.sc{border-radius:var(--radius);padding:20px 22px;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;}
.sc:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.3);}
.sc.g{background:linear-gradient(135deg,#059669,#10b981);}
.sc.c{background:linear-gradient(135deg,#0284c7,#06b6d4);}
.sc.p{background:linear-gradient(135deg,#7c3aed,#a855f7);}
.sc.o{background:linear-gradient(135deg,#d97706,#f59e0b);}
.sc.r{background:linear-gradient(135deg,#dc2626,#ef4444);}
.sc.b{background:linear-gradient(135deg,#1d4ed8,#3b82f6);}
.sc .bg-ico{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:38px;opacity:.2;}
.sc-lbl{font-size:11px;font-weight:600;opacity:.85;margin-bottom:7px;letter-spacing:.3px;}
.sc-val{font-size:32px;font-weight:800;line-height:1;}
.sc-sub{font-size:11px;opacity:.75;margin-top:7px;}

/* ── CARD ── */
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;}
.cd-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 13px;border-bottom:1px solid var(--border);}
.cd-h h3{font-size:14px;font-weight:700;}
.cd-h h3 span{font-size:11px;color:var(--text2);font-weight:400;margin-left:5px;}
.cd-h a{font-size:12px;color:var(--teal);cursor:pointer;font-weight:500;text-decoration:none;}
.cd-h a:hover{text-decoration:underline;}
.cd-b{padding:16px 20px;}

/* ── GRID LAYOUTS ── */
.g21{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:0;}
.g12{display:grid;grid-template-columns:1fr 2fr;gap:16px;}
.g11{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:left;padding:11px 14px;font-size:10px;color:var(--text2);font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--card2);border-bottom:1px solid var(--border);}
.tbl td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(255,255,255,.02);}
.tbl-wrap{overflow-x:auto;}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.b-pending{background:rgba(245,158,11,.15);color:#fbbf24;}
.b-confirmed{background:rgba(14,165,233,.15);color:#38bdf8;}
.b-done{background:rgba(0,201,167,.15);color:var(--teal);}
.b-cancelled{background:rgba(239,68,68,.15);color:#f87171;}
.b-low{background:rgba(245,158,11,.15);color:#fbbf24;}
.b-critical{background:rgba(239,68,68,.15);color:#f87171;}
.b-ok{background:rgba(0,201,167,.15);color:var(--teal);}
.b-expired{background:rgba(239,68,68,.15);color:#f87171;}
.b-admin{background:rgba(124,58,237,.2);color:#a78bfa;}
.b-doctor{background:rgba(14,165,233,.15);color:#38bdf8;}
.b-staff{background:rgba(0,201,167,.15);color:var(--teal);}

/* ── BUTTONS ── */
.btn{padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:all .2s;}
.btn-teal{background:linear-gradient(135deg,var(--teal),#0ea5e9);color:#fff;}
.btn-teal:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,201,167,.35);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-ghost:hover{background:var(--card2);color:var(--text);}
.btn-red{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#f87171;}
.btn-red:hover{background:rgba(239,68,68,.22);}
.btn-sm{padding:5px 11px;font-size:11px;}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:12px;transition:all .2s;}
.icon-btn:hover{background:var(--card2);color:var(--text);}
.icon-btn.del:hover{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.3);}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.sb-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 13px;flex:1;min-width:180px;}
.sb-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit;width:100%;}
.sb-box input::placeholder{color:var(--text3);}
.sb-box i{color:var(--text3);font-size:12px;}
.sel{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 13px;color:var(--text);font-size:12px;font-family:inherit;outline:none;cursor:pointer;min-width:130px;}

/* ── FTABS ── */
.ftabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.ft{padding:7px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;background:var(--card);border:1px solid var(--border);color:var(--text2);}
.ft.on{background:rgba(0,201,167,.15);border-color:var(--teal);color:var(--teal);}

/* ── NEXT VISIT BADGES ── */
.nv-badge{font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;margin-bottom:2px;}
.nv-badge.past{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.nv-badge.today{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.4);animation:pulse 1.5s infinite;}
.nv-badge.soon{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3);}
.nv-badge.ok{background:rgba(0,201,167,.08);color:var(--teal);border:1px solid rgba(0,201,167,.15);}
.bell-dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);animation:pulse 1.5s infinite;}
.bell-btn{background:rgba(239,68,68,.12)!important;color:#f87171!important;border-color:rgba(239,68,68,.25)!important;}
.card-alert{border-color:rgba(239,68,68,.35)!important;box-shadow:0 0 0 1px rgba(239,68,68,.2);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── AUTOCOMPLETE ── */
.ac-drop{position:absolute;top:100%;left:0;right:0;background:var(--card2);border:1px solid rgba(0,201,167,.35);border-radius:9px;z-index:500;max-height:200px;overflow-y:auto;display:none;margin-top:3px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.ac-drop.show{display:block;}
.ac-item{padding:10px 14px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(255,255,255,.04);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover{background:rgba(0,201,167,.12);}
.ac-item .ac-pet{font-size:13px;font-weight:700;}
.ac-item .ac-owner{font-size:11px;color:var(--text2);margin-top:2px;}
.ac-item .ac-reg{font-size:10px;color:var(--teal);margin-top:1px;}

/* ── TOKEN ── */
.token-wrap{text-align:center;padding:24px 16px;}
.tok-num{font-size:88px;font-weight:800;color:var(--teal);line-height:1;text-shadow:0 0 50px rgba(0,201,167,.45);}
.tok-lbl{font-size:11px;color:var(--text2);margin-top:4px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}
.tok-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
.tok-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.tok-item .n{font-size:24px;font-weight:800;}
.tok-item .l{font-size:10px;color:var(--text2);margin-top:3px;}
.tok-item.waiting .n{color:#fbbf24;}
.tok-item.done .n{color:var(--teal);}
.tok-item.total .n{color:var(--blue);}
.tok-btns{display:flex;gap:8px;justify-content:center;margin-top:16px;}

/* ── APPOINTMENT LIST ITEMS ── */
.al{padding:0;}
.al-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.al-row:last-child{border-bottom:none;}
.al-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.al-info{flex:1;}
.al-info .pn{font-size:13px;font-weight:700;}
.al-info .ow{font-size:11px;color:var(--text2);margin-top:1px;}
.al-time{text-align:right;}
.al-time .t{font-size:13px;font-weight:700;color:var(--teal);}
.al-time .d{font-size:10px;color:var(--text2);}

/* ── STOCK BARS ── */
.st-row{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.st-row:last-child{border-bottom:none;}
.st-meta{display:flex;justify-content:space-between;margin-bottom:6px;}
.st-meta .nm{font-size:12px;font-weight:600;}
.st-meta .qt{font-size:11px;color:var(--text2);}
.bar-bg{background:var(--card2);border-radius:3px;height:5px;}
.bar{height:5px;border-radius:3px;transition:width .6s;}
.bar.red{background:#ef4444;}
.bar.orange{background:#f59e0b;}
.bar.teal{background:var(--teal);}

/* ── REFUND ITEM ROWS ── */
.rf-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;background:var(--card2);transition:all .15s;}
.rf-item.selected{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.06);}
.rf-item.fully-refunded{opacity:.45;pointer-events:none;}
.rf-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:all .15s;}
.rf-check.on{background:#ef4444;border-color:#ef4444;color:#fff;}
.rf-qty-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.rf-qty-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.rf-qty-btn:hover{background:rgba(239,68,68,.15);border-color:#ef4444;color:#ef4444;}
.rf-qty-val{font-size:13px;font-weight:800;min-width:20px;text-align:center;color:var(--text);}

/* ── RECEIPT HISTORY ── */
.rx-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.rx-row:hover{background:rgba(255,255,255,.03);}
.rx-row:last-child{border-bottom:none;}
.rx-no{font-size:11px;font-weight:800;color:var(--teal);min-width:80px;}
.rx-no.refunded{color:#f87171;text-decoration:line-through;}
.rx-pat{font-size:12px;font-weight:700;flex:1;}
.rx-amt{font-size:13px;font-weight:800;color:var(--teal);white-space:nowrap;}
.rx-amt.refunded{color:#f87171;}
.rx-meta{font-size:10px;color:var(--text3);}
.rx-tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px;background:rgba(239,68,68,.15);color:#f87171;}
/* POS tabs (history) */
.pos-panel-tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2);transition:all .15s;}
.pos-panel-tab.on{color:var(--teal);border-bottom-color:var(--teal);}

/* ── PRINT IFRAME ── */
#printIframe{position:fixed;left:-9999px;top:0;width:320px;height:600px;border:none;}
.rev-chart{display:flex;align-items:flex-end;gap:8px;height:100px;padding:6px 0 0;}
.rc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.rb{width:100%;border-radius:5px 5px 0 0;transition:all .3s;cursor:pointer;position:relative;}
.rb:hover::after{content:attr(data-val);position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;}
.rb.hi{background:linear-gradient(to top,var(--teal2),var(--teal));}
.rb.lo{background:var(--card2);}
.rm{font-size:9px;color:var(--text3);}

/* ── WEEKLY APPOINTMENTS CHART (new) ── */
.wk-chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding:12px 4px 0;position:relative;}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;cursor:pointer;}
.wk-col:hover .wk-bar{filter:brightness(1.15);}
.wk-count-bubble{font-size:11px;font-weight:800;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:5px;transition:all .3s;}
.wk-bar{width:100%;border-radius:8px 8px 0 0;transition:all .4s cubic-bezier(.34,1.56,.64,1);position:relative;min-height:6px;}
.wk-bar-base{width:100%;height:3px;background:var(--border);border-radius:0 0 4px 4px;margin-bottom:8px;}
.wk-day{font-size:10px;font-weight:700;letter-spacing:.3px;}
.wk-date{font-size:9px;margin-top:1px;}
.wk-col.today .wk-day{color:var(--teal);}
.wk-col.today .wk-date{color:var(--teal);opacity:.8;}
.wk-col:not(.today) .wk-day{color:var(--text2);}
.wk-col:not(.today) .wk-date{color:var(--text3);}
.wk-col.today .wk-bar{box-shadow:0 4px 16px rgba(0,201,167,.35);}
.wk-grid-lines{position:absolute;inset:12px 0 44px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;z-index:0;}
.wk-grid-line{width:100%;height:1px;background:var(--border);opacity:.5;}

/* ── DONUT (CSS) ── */
.donut-wrap{display:flex;align-items:center;gap:24px;padding:8px 0;}
.donut{width:100px;height:100px;border-radius:50%;background:conic-gradient(var(--teal) 0% 40%,#fbbf24 40% 65%,#38bdf8 65% 80%,#f87171 80% 100%);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.donut-hole{width:62px;height:62px;background:var(--card);border-radius:50%;}
.donut-legend{flex:1;}
.dl{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px;}
.dc{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav button{background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:13px;transition:all .2s;}
.cal-nav button:hover{background:var(--card);color:var(--text);}
.cal-mo{font-size:14px;font-weight:700;}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;width:100%;}
.cal-dh{text-align:center;font-size:10px;color:var(--text2);padding:6px 0;font-weight:700;}
.cal-d{height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;border:1px solid transparent;position:relative;min-width:0;width:100%;}
.cal-d:hover{background:var(--card2);}
.cal-d.today{background:rgba(0,201,167,.15);border-color:var(--teal);color:var(--teal);font-weight:800;}
.cal-d.has::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--blue);}
.cal-d.sel{background:var(--teal);color:#fff;font-weight:700;}
.cal-d.oth{color:var(--text3);}

/* ── PET CARDS ── */
.pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.pet-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;}
.pet-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.3);border-color:rgba(0,201,167,.25);}
.pc-top{padding:18px;background:linear-gradient(135deg,var(--card2),var(--card));display:flex;gap:14px;align-items:flex-start;}
.pc-emo{width:56px;height:56px;border-radius:13px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
.pc-info .pname{font-size:16px;font-weight:800;}
.pc-info .psp{font-size:12px;color:var(--teal);font-weight:600;margin-top:2px;}
.pc-info .pow{font-size:12px;color:var(--text2);margin-top:3px;}
.pc-info .preg{font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:.5px;}
.pc-body{padding:14px 18px;}
.pc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pm-item .pl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.pm-item .pv{font-size:12px;font-weight:600;margin-top:2px;}
.pc-foot{padding:11px 18px;border-top:1px solid var(--border);display:flex;gap:7px;}
.pc-btn{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;}
.pc-btn:hover{background:var(--bg);color:var(--text);}
.pc-btn.tl{border-color:rgba(0,201,167,.3);color:var(--teal);background:rgba(0,201,167,.08);}

/* ── MEDICAL HISTORY TABS ── */
.med-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px;}
.mt{padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;background:var(--card);border:1px solid var(--border);color:var(--text2);}
.mt.on{background:rgba(0,201,167,.15);border-color:var(--teal);color:var(--teal);}
/* New horizontal pill tabs for med panel */
.mht{padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;color:var(--text2);border:1px solid transparent;border-bottom:none;transition:all .18s;flex-shrink:0;}
.mht.on{background:var(--bg);color:var(--teal);border-color:var(--border);}
.mht:hover:not(.on){color:var(--text);background:rgba(255,255,255,.04);}
/* Treatment timeline card */
.tx-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;position:relative;transition:box-shadow .2s;}
.tx-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.3);}
.tx-card::before{content:'';position:absolute;left:-1px;top:20px;bottom:20px;width:3px;border-radius:0 2px 2px 0;background:var(--teal);}
.tx-date-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,201,167,.1);border:1px solid rgba(0,201,167,.2);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--teal);margin-bottom:10px;}
.tx-diag{font-size:15px;font-weight:800;color:#f1f5f9;margin-bottom:12px;line-height:1.4;}
.tx-section-label{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;}
.tx-inj-label{color:#a5b4fc;}
.tx-med-label{color:var(--teal);}
.tx-followup-title{font-size:11px;font-weight:800;color:#fbbf24;letter-spacing:.5px;}
.tx-pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;margin:2px;}
.tx-inj-pill{background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);color:#a5b4fc;}
.tx-med-pill{background:rgba(0,201,167,.1);border:1px solid rgba(0,201,167,.2);color:var(--teal);}
.tx-followup{display:flex;align-items:center;gap:8px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:8px;padding:8px 12px;margin-top:12px;}
.tx-note{font-size:12px;color:var(--text2);border-top:1px solid var(--border);padding-top:10px;margin-top:10px;font-style:italic;}
.med-empty{text-align:center;padding:48px 20px;color:var(--text3);}
.med-empty .ei{font-size:40px;margin-bottom:10px;}
.med-empty .et{font-size:13px;font-weight:600;margin-bottom:14px;}
@keyframes slideInRight{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── BILLING ── */
/* ── POS ── */
.pos-tab{padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;color:var(--text2);border:1px solid transparent;border-bottom:none;transition:all .15s;flex-shrink:0;}
.pos-tab.on{background:var(--bg);color:var(--teal);border-color:var(--border);}
.pos-tab:hover:not(.on){color:#f1f5f9;background:rgba(255,255,255,.05);}
.pos-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 10px;cursor:pointer;transition:all .18s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;}
.pos-item:hover{border-color:var(--teal);background:rgba(0,201,167,.06);transform:translateY(-2px);}
.pos-item:active{transform:scale(.97);}
.pos-item .pi{font-size:26px;line-height:1;}
.pos-item .pn{font-size:11px;font-weight:700;color:#f1f5f9;line-height:1.3;}
.pos-item .pp{font-size:12px;font-weight:800;color:var(--teal);}
.pos-item .pc{font-size:9px;color:var(--text3);}
/* Cart rows */
.cart-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.04);}
.cart-row:last-child{border-bottom:none;}
.cart-ico{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
.cart-name{flex:1;font-size:13px;font-weight:600;color:#f1f5f9;}
.cart-price{font-size:12px;color:var(--text2);}
.cart-qty-ctrl{display:flex;align-items:center;gap:4px;}
.cqb{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:#f1f5f9;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.cqb:hover{background:var(--teal);border-color:var(--teal);}
.cart-total{font-size:13px;font-weight:800;color:var(--teal);min-width:70px;text-align:right;}
.cart-del{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.cart-del:hover{color:#ef4444;background:rgba(239,68,68,.1);}
/* Payment method */
.pay-method{padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:11px;font-weight:700;text-align:center;color:var(--text2);transition:all .15s;}
.pay-method.on{border-color:var(--teal);background:rgba(0,201,167,.12);color:var(--teal);}
.pay-method:hover:not(.on){border-color:var(--text2);color:#f1f5f9;}
.emoji-pick{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:7px;cursor:pointer;border:2px solid transparent;background:var(--card2);transition:all .15s;}
.emoji-pick.on{border-color:var(--teal);background:rgba(0,201,167,.15);}
.emoji-pick:hover:not(.on){background:var(--card);}
/* Toggle switch */
.toggle-switch{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--card);border:1px solid var(--border);border-radius:26px;transition:.2s;}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:var(--text3);border-radius:50%;transition:.2s;}
.toggle-switch input:checked + .toggle-slider{background:rgba(0,201,167,.2);border-color:var(--teal);}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(22px);background:var(--teal);}
body.light .toggle-slider{background:#f1f5f9;border-color:#d1d5db;}
body.light .toggle-slider:before{background:#9ca3af;}
body.light .toggle-switch input:checked + .toggle-slider{background:rgba(0,158,130,.15);border-color:var(--teal);}
body.light .toggle-switch input:checked + .toggle-slider:before{background:var(--teal);}
.ci-tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--border);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;}
.ci-tag:hover,.ci-tag.on{background:rgba(0,201,167,.12);border-color:var(--teal);color:var(--teal);}.bill-left{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
.bill-right{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;}
.bill-search{padding:14px 16px;border-bottom:1px solid var(--border);}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;overflow-y:auto;flex:1;}
.prod-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;text-align:center;}
.prod-item:hover{border-color:var(--teal);transform:translateY(-2px);}
.prod-item .pi{font-size:26px;margin-bottom:8px;}
.prod-item .pn{font-size:12px;font-weight:700;margin-bottom:4px;}
.prod-item .pp{font-size:13px;font-weight:800;color:var(--teal);}
.prod-item .ps{font-size:10px;color:var(--text2);}
.bill-order{flex:1;overflow-y:auto;padding:14px 16px;}
.ord-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.ord-item:last-child{border-bottom:none;}
.ord-name{flex:1;font-size:13px;font-weight:600;}
.ord-qty{display:flex;align-items:center;gap:6px;}
.qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.ord-price{font-size:13px;font-weight:700;color:var(--teal);min-width:60px;text-align:right;}
.bill-summary{padding:16px;border-top:1px solid var(--border);}
.sum-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
.sum-row.total{font-size:16px;font-weight:800;color:var(--teal);}
.sum-row .lbl{color:var(--text2);}
.pay-btns{display:flex;gap:8px;margin-top:14px;}

/* ── INV TABLE HIGHLIGHT ── */
.exp-warn{color:#f87171;font-weight:700;}
.exp-soon{color:#fbbf24;font-weight:700;}
.low-qty{color:#fbbf24;}
.crit-qty{color:#f87171;font-weight:700;}

/* ── SUMMARY ── */
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;}
.sum-card .sv{font-size:28px;font-weight:800;color:var(--teal);}
.sum-card .sl{font-size:11px;color:var(--text2);margin-top:5px;}

/* ── SOP ── */
.sop-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.sop-cat{padding:8px 16px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;background:var(--card);border:1px solid var(--border);color:var(--text2);}

/* ---- helpers (date convention copied from Finance td()/dLeft()) ---- */
function td(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function dLeft(s){return Math.round((new Date(s)-new Date(td()))/864e5)}
function n0(x){x=+x;return isFinite(x)?x:0}
function num(x){if(typeof x==='string')x=+x;return typeof x==='number'&&isFinite(x)?x:0}   /* inventory numbers: null, '', undefined, NaN, Infinity, junk -> 0; '5' -> 5; negatives kept (Finance treats qty<=0 as Out) */
function objs(a){return Array.isArray(a)?a.filter(function(x){return x&&typeof x==='object'}):[]}
function isD(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;var y=+s.slice(0,4),m=+s.slice(5,7),d=+s.slice(8),t=new Date(0);t.setUTCFullYear(y,m-1,d);return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d}
function ks(n){n=Math.round(n0(n));return (n<0?'\u2212':'')+Math.abs(n).toLocaleString()+' Ks'}
function skip(k){SK[k]=(SK[k]||0)+1}
function pad2(n){return ('0'+n).slice(-2)}
function addDays(s,n){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function dmy(s){return isD(s)?s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'\u2014'}
function cmp(n){var a=Math.abs(n),s=n<0?'\u2212':'';return a>=1e6?s+(a/1e6).toFixed(1)+'M':a>=1e3?s+Math.round(a/1e3)+'k':s+Math.round(a)}
function $d(id){return document.getElementById(id)}
function tryv(f){try{return f()}catch(e){try{console.error('Dashboard:',e)}catch(x){}return null}}
/* ---- html builders ---- */
function card(c,k,l,v,s){return '<div class="sc '+c+'" data-k="'+k+'"><div class="sc-lbl">'+E(l)+'</div><div class="sc-val">'+E(v)+'</div>'+(s?'<div class="sc-sub">'+E(s)+'</div>':'')+'</div>'}
function sg(a){return '<div class="sg" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+a.join('')+'</div>'}
function cd(t,link,body,k){return '<div class="cd" data-k="'+k+'"><div class="cd-h"><h3>'+E(t)+'</h3>'+(link?'<a onclick="navTo(\''+link[0]+'\',\''+link[1]+'\')">'+E(link[2])+' \u2192</a>':'')+'</div>'+body+'</div>'}
function unavail(t){return '<div class="cd"><div class="cd-h"><h3>'+E(t)+'</h3></div><div class="dash-empty">Unavailable \u2014 data could not be read.</div></div>'}
function tbl(h,rows){return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+h.map(function(x){return '<th>'+E(x)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function more(n,cap){return n>cap?'<div class="dash-more">+'+(n-cap)+' more \u2014 open the module to see all</div>':''}
function badge(c,t){return '<span class="badge '+c+'">'+E(t)+'</span>'}
function kv(l,v,sub){return '<div class="dash-kv"><span>'+E(l)+(sub?'<small>'+E(sub)+'</small>':'')+'</span><b>'+E(v)+'</b></div>'}
function empty(t){return '<div class="dash-empty">'+E(t)+'</div>'}
/* ---- patient care ---- */
var AB={Pending:'b-pending',Confirmed:'b-confirmed',Done:'b-done',Cancelled:'b-cancelled'};
function apptStats(){var T=td(),nx=addDays(T,7),r={rows:[],n:0,past:0,next:0,st:{Pending:0,Confirmed:0,Done:0,Cancelled:0}};
 objs(DA.appts()).forEach(function(x){
  if(!isD(x.date)){skip('appt');return}
  var s=x.status,live=s!=='Cancelled';
  if(x.date===T){if(AB.hasOwnProperty(s))r.st[s]++;if(live){r.n++;r.rows.push(x)}}
  else if(x.date<T){if(s==='Pending'||s==='Confirmed')r.past++}
  else if(x.date<=nx&&live)r.next++;
 });
 r.rows.sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''))});return r}
function ipStats(){var T=td(),r={adm:[],dis:0};
 objs(DA.ip()).forEach(function(x){if(x.status==='Admitted')r.adm.push(x);else if(x.status==='Discharged'&&typeof x.dischargeAt==='string'&&x.dischargeAt.slice(0,10)===T)r.dis++});
 r.adm.sort(function(a,b){return String(b.admitAt||'').localeCompare(String(a.admitAt||''))});return r}
function ipDays(x){var d=Math.ceil((Date.now()-new Date(x.admitAt))/864e5);return isFinite(d)?Math.max(1,d):null}
function patStats(){var T=td(),M=T.slice(0,7),r={reg:0,active:0,owners:0,sp:[],vis:0,visTotal:0,visBad:0,visFut:0,visOk:true},ow=new Set(),sp=new Map();
 objs(DA.pets()).forEach(function(p){
  if(p.archived)return;
  r.reg++;if((p.pstatus||'Active')==='Active')r.active++;
  var k=p.ownerId?'i:'+p.ownerId:(p.owner?'n:'+p.owner:'');if(k)ow.add(k);
  var s=(p.species==null||p.species==='')?'Not recorded':String(p.species);sp.set(s,(sp.get(s)||0)+1);
  (Array.isArray(p.visits)?p.visits:[]).forEach(function(v){r.visTotal++;var d=v&&v.f&&v.f.date;
   if(!isD(d)){r.visBad++;return}
   if(d>T){r.visFut++;return}
   if(d.slice(0,7)===M)r.vis++});
 });
 r.owners=ow.size;r.sp=Array.from(sp.entries()).sort(function(a,b){return b[1]-a[1]||(a[0]<b[0]?-1:1)});
 if(r.visTotal>0&&r.visBad===r.visTotal)r.visOk=false;return r}
/* ---- inventory: Finance logic mirrored (checked against finance_6.html). Works on in-memory copies; storage is never modified. ----
   invSafe() is what Doctor and Staff use: it copies only name, unit, track, arch, qty, min and batch qty/expiry. It never touches money fields. */
function invSafe(){return objs(DA.inv()).map(function(i){var bs=Array.isArray(i.batches)?i.batches:[],c={name:String(i.name==null?'':i.name),unit:String(i.unit==null?'':i.unit),track:i.track,arch:i.arch,qty:num(i.qty),min:num(i.min),batches:objs(bs).map(function(b){return{qty:num(b.qty),exp:b.exp}})};
 if(i.track!==false&&c.qty>0&&!bs.length)c.batches.push({qty:c.qty,exp:''});return c})}
function exOf(i){var e=(i.batches||[]).filter(function(b){return b.qty>0&&b.exp}).map(function(b){return b.exp}).sort();return e[0]||''}
function dLeft(s){return Math.round((new Date(s)-new Date(td()))/864e5)}
function st(i){if(i.track===false)return 'OK';var e=exOf(i),d=e?dLeft(e):999;if(i.qty<=0)return 'Out';if(d<0)return 'Expired';if(i.min&&i.qty<i.min*.5)return 'Critical';if(i.qty<i.min)return 'Low';if(d<=90)return 'Exp.Soon';return 'OK'}
var SEV={Out:0,Expired:1,Critical:2,Low:3,'Exp.Soon':4},SB={Out:'b-critical',Expired:'b-expired',Critical:'b-critical',Low:'b-low','Exp.Soon':'b-pending'};
function invAlerts(){var r={items:[],c:{Low:0,Critical:0,Expired:0,'Exp.Soon':0,Out:0},total:0};
 invSafe().forEach(function(i){if(i.arch)return;var s=st(i);if(s==='OK')return;r.c[s]++;r.total++;r.items.push({name:i.name,qty:i.qty,min:i.min,unit:i.unit,exp:exOf(i),s:s})});
 r.items.sort(function(a,b){return SEV[a.s]-SEV[b.s]||(a.name.toLowerCase()<b.name.toLowerCase()?-1:1)});return r}
/* ---- finance (Admin only): copied from Finance fin(), gOk(), gPaid(), stOf(), stock valuation ---- */
function fin(pref,D){var o={sales:0,ref:0,cogs:0,cogsBack:0,nS:0,nR:0,exp:0,expCat:Object.create(null),purch:0,nG:0},ok=function(d){return typeof d==='string'&&d.slice(0,pref.length)===pref};
 D.tx.forEach(function(t){if(!ok(t.date))return;
  if(t.isRefund){o.ref+=n0(t.total);o.cogsBack+=n0(t.cogsBack);o.nR++}
  else{if(t.refunded&&!(t.refunds&&t.refunds.length))return;o.sales+=n0(t.total);o.cogs+=n0(t.cogs);o.nS++}});
 D.exps.forEach(function(e){if(ok(e.date)){var a=n0(e.amount),c=String(e.cat==null||e.cat===''?'Other':e.cat);o.exp+=a;o.expCat[c]=(o.expCat[c]||0)+a}});
 D.grs.forEach(function(g){if(g.status==='Received'&&ok(g.date)){o.purch+=n0(g.total);o.nG++}});
 o.net=o.sales-o.ref;o.cogsNet=o.cogs-o.cogsBack;o.gross=o.net-o.cogsNet;o.profit=o.gross-o.exp;return o}
/* Finance legacy normalization mirrored in memory: grNorm (payments from g.paid) and normExp (payments = amount) */
function gOk(g){return g.status!=='Cancelled'&&g.status!=='Void'&&g.status!=='Returned'}
function gPays(g){return g.payments?(Array.isArray(g.payments)?g.payments:[]):(n0(g.paid)>0?[{amt:g.paid}]:[])}
function gPaid(g){return gPays(g).reduce(function(t,p){return t+n0(p&&p.amt)},0)}
function ePays(e){return e.payments?(Array.isArray(e.payments)?e.payments:[]):[{amt:e.amount}]}
function paidOf(e){return ePays(e).reduce(function(s,p){return s+n0(p&&p.amt)},0)}
/* Admin only. Costs are read here and nowhere else. */
function invCosted(){return objs(DA.inv()).map(function(i){var bs=Array.isArray(i.batches)?i.batches:[],c={track:i.track,arch:i.arch,qty:num(i.qty),batches:objs(bs).map(function(b){return{qty:num(b.qty),cost:num(b.cost)}})};
 if(i.track!==false&&c.qty>0&&!bs.length)c.batches.push({qty:c.qty,cost:num(i.cost)});return c})}
function invValue(){var v=0;invCosted().forEach(function(i){if(i.arch||i.track===false||!(i.qty>0))return;i.batches.forEach(function(b){v+=b.qty*b.cost})});return v}
function finStats(){var R={tx:objs(DA.tx()),exps:objs(DA.exps()),grs:objs(DA.grs())},D={},T=td(),M=T.slice(0,7),r={};
 /* period figures use only records with a valid calendar date; balances (payables, outstanding expenses) use every record, as Finance does */
 ['tx','exps','grs'].forEach(function(k){D[k]=R[k].filter(function(x){if(isD(x.date))return true;skip('fin');return false})});
 r.today=fin(T,D);r.month=fin(M,D);r.trend=[];
 var y=+T.slice(0,4),m=+T.slice(5,7);
 for(var k=5;k>=0;k--){var d=new Date(y,m-1-k,1),p=d.getFullYear()+'-'+pad2(d.getMonth()+1);r.trend.push({p:p,l:MN[d.getMonth()]+' '+String(d.getFullYear()).slice(2),f:p===M?r.month:fin(p,D)})}
 r.label=MN[m-1]+' '+y;
 r.pay=0;r.payN=0;R.grs.forEach(function(g){if(!gOk(g))return;var o=n0(g.total)-gPaid(g);r.pay+=o;if(o>0.0005)r.payN++});   /* Finance gDash(): OUTSTANDING = sum(total - gPaid) over gOk receipts, Pending included */
 r.eo=0;r.eoN=0;R.exps.forEach(function(e){var o=n0(e.amount)-paidOf(e);r.eo+=o;if(o>0)r.eoN++});
 r.val=invValue();return r}
/* ---- sections ---- */
function apptCard(ap){if(!ap)return unavail('Appointments today');
 var rows=ap.rows.slice(0,8).map(function(x){return '<tr><td>'+E(x.time||'\u2014')+'</td><td><b>'+E(x.pet)+'</b><div class="mut">'+E(x.owner)+'</div></td><td>'+E(x.type)+'</td><td>'+E(x.doctor)+'</td><td>'+badge(AB[x.status]||'',x.status||'\u2014')+'</td></tr>'});
 return cd('Appointments today',['patients.html','appointments','Open'],'<div class="dash-chips">Pending '+ap.st.Pending+' \u00b7 Confirmed '+ap.st.Confirmed+' \u00b7 Done '+ap.st.Done+' \u00b7 Cancelled '+ap.st.Cancelled+'<br>Next 7 days: '+ap.next+' \u00b7 Past-due open: '+ap.past+'</div>'+(rows.length?tbl(['Time','Pet / Owner','Type','Doctor','Status'],rows)+more(ap.rows.length,8):empty('No appointments today')),'apptCard')}
function ipCard(ip){if(!ip)return unavail('Inpatients now');
 var r2=ip.adm.slice(0,6).map(function(x){var d=ipDays(x);return '<tr><td><b>'+E(x.pet)+'</b><div class="mut">'+E(x.owner)+'</div></td><td>'+E(x.cage||'\u2014')+'</td><td>'+E(x.doctor||'\u2014')+'</td><td>'+(d==null?'\u2014':d)+'</td></tr>'});
 return cd('Inpatients now',['patients.html','inpatients','Open'],'<div class="dash-chips">Admitted '+ip.adm.length+' \u00b7 Discharged today '+ip.dis+'</div>'+(r2.length?tbl(['Pet / Owner','Cage','Doctor','Days'],r2)+more(ip.adm.length,6):empty('No inpatients admitted')),'ipCard')}
function secPatients(pt){if(!pt)return '<div class="dash-grid">'+unavail('Patients')+'</div>';
 var sp=pt.sp.slice(0,8).map(function(x){return kv(x[0],String(x[1]))}).join('')+(pt.sp.length>8?'<div class="dash-more">+'+(pt.sp.length-8)+' more species</div>':'');
 return '<div class="dash-grid">'+cd('Patients',['patients.html','patients','Open'],kv('Active patients',String(pt.active),pt.reg+' registered (archived not counted)')+kv('Owners',String(pt.owners)),'patCard')+cd('Species (as recorded)',null,sp||empty('No patients recorded'),'spCard')+'</div>'}
function trendHtml(tr){var mx=1;tr.forEach(function(t){mx=Math.max(mx,Math.abs(t.f.net),Math.abs(t.f.profit))});
 var h='<div class="dash-trend">'+tr.map(function(t){var a=Math.abs(t.f.net),b=Math.abs(t.f.profit);
  return '<div class="dash-col" title="'+E(t.l+' \u2014 Net sales '+ks(t.f.net)+' \u00b7 Net profit '+ks(t.f.profit))+'"><div class="dash-bars"><div class="dash-bar '+(t.f.net<0?'n':'s')+'" style="height:'+Math.max(2,Math.round(a/mx*96))+'px"></div><div class="dash-bar '+(t.f.profit<0?'n':'p')+'" style="height:'+Math.max(2,Math.round(b/mx*96))+'px"></div></div><div class="dash-val">'+E(t.l)+'<br>'+cmp(t.f.net)+'<br>'+cmp(t.f.profit)+'</div></div>'}).join('')+'</div>';
 return h+'<div class="dash-legend"><span><i style="background:var(--teal)"></i>Net sales</span><span><i style="background:var(--blue)"></i>Net profit</span><span><i style="background:#ef4444"></i>Negative</span></div>'}
function secFinance(f){if(!f)return '<div class="dash-grid">'+unavail('Finance')+'</div>';
 var m=f.month,cats=Object.keys(m.expCat).sort(function(a,b){return m.expCat[b]-m.expCat[a]}).slice(0,5);
 var cards=sg([card('b','netSalesMonth','Net sales',ks(m.net),m.nS+' sales \u00b7 '+m.nR+' refunds'),card('r','refundsMonth','Refunds',ks(m.ref),m.nR+' refund(s)'),card('c','grossMonth','Gross profit',ks(m.gross),(m.net?Math.round(m.gross/m.net*100):0)+'% of net sales'),card('o','expensesMonth','Operating expenses',ks(m.exp),'by expense date'),card(m.profit>=0?'g':'r','profitMonth','Net profit',ks(m.profit),'gross profit \u2212 expenses')]);
 var money=kv('Supplier payables',ks(f.pay),f.payN+' receipt(s) with a balance \u00b7 pending included')+kv('Outstanding expenses',ks(f.eo),f.eoN+' partly paid or unpaid')+kv('Purchases received',ks(m.purch),m.nG+' receipt(s) \u00b7 not an expense')+kv('Stock valuation',ks(f.val),'batch qty \u00d7 batch cost');
 return cards+'<div class="dash-grid">'+cd('Payables, purchases and stock value',['finance.html','goodsreceipt','Open'],money,'moneyCard')+cd('Last 6 months',null,trendHtml(f.trend),'trendCard')+cd('Top expenses this month',['finance.html','expenses','Open'],cats.length?cats.map(function(c){return kv(c,ks(m.expCat[c]))}).join(''):empty('No expenses this month'),'expCard')+'</div>'}
function secInv(iv){if(!iv)return '<div class="dash-grid">'+unavail('Inventory alerts')+'</div>';
 var cards=sg([card('o','invLow','Low stock',String(iv.c.Low+iv.c.Critical),'low + critical'),card('r','invExpired','Expired',String(iv.c.Expired),'earliest batch past expiry'),card('p','invSoon','Expiring soon',String(iv.c['Exp.Soon']),'within 90 days'),card('c','invOut','Out of stock',String(iv.c.Out),'quantity 0')]);
 var rows=iv.items.slice(0,10).map(function(x){return '<tr><td><b>'+E(x.name)+'</b></td><td>'+E(String(x.qty))+' '+E(x.unit)+'</td><td>'+E(String(x.min))+'</td><td>'+dmy(x.exp)+'</td><td>'+badge(SB[x.s],x.s)+'</td></tr>'});
 return cards+cd('Items needing attention',['finance.html','inventory','Open Stock'],rows.length?tbl(['Item','Qty','Min','Earliest expiry','Status'],rows)+more(iv.items.length,10):empty('No stock alerts'),'invCard')}
function sect(t,f){try{return f()}catch(e){try{console.error('Dashboard section failed:',t,e)}catch(x){}return unavail(t)}}
function topCards(ap,ip,iv,pt,fn,adm){
 var top=[card('c','apptToday','Appointments today',ap?String(ap.n):'\u2014',ap?'excluding cancelled':'unavailable'),card(ap&&ap.past?'o':'c','apptPast','Past-due open',ap?String(ap.past):'\u2014','Pending / Confirmed before today'),card('p','ipNow','Admitted now',ip?String(ip.adm.length):'\u2014',ip?ip.dis+' discharged today':'unavailable'),card('r','invTotal','Stock alerts',iv?String(iv.total):'\u2014','items need attention')];
 if(pt&&pt.visOk)top.push(card('g','visitsMonth','Visits This Month',String(pt.vis),'up to today'));
 if(adm)top.push(card('b','netSalesToday','Net sales today',fn?ks(fn.today.net):'\u2014',fn?fn.today.nS+' sales \u00b7 '+fn.today.nR+' refunds':'unavailable'));
 return sg(top)}
function renderInner(root){
 if(!dashRole()){lockUi();root.innerHTML='<div class="cd" data-k="noAccess"><div class="cd-h"><h3>No access</h3></div><div class="dash-empty">The Dashboard is available to Admin, Doctor and Staff only. Navigation is hidden for this role.</div></div>';return}
 var adm=ROLE==='admin',doc=ROLE==='doctor';
 var ap=tryv(apptStats),ip=tryv(ipStats),iv=tryv(invAlerts),pt=(adm||doc)?tryv(patStats):null,fn=adm?tryv(finStats):null,nm=tryv(DA.clinic)||'PET WORLD Vet Clinic';
 var h='<div class="dash-top"><div><div class="dash-clinic">'+E(nm)+'</div><div class="dash-meta"><span class="badge b-'+ROLE+'">'+E(ROLE)+'</span><span>Read-only overview</span></div></div><div class="dash-meta"><span>Updated '+new Date().toTimeString().slice(0,5)+'</span><button class="btn btn-ghost btn-sm" onclick="render()">\u21bb Refresh</button></div></div>';
 h+=sect('Overview',function(){return topCards(ap,ip,iv,pt,fn,adm)});
 h+='<div class="dash-sec">Patient care</div><div class="dash-grid">'+sect('Appointments today',function(){return apptCard(ap)})+sect('Inpatients now',function(){return ipCard(ip)})+'</div>';
 if(adm||doc)h+='<div class="dash-sec">Patient activity</div>'+sect('Patient activity',function(){return secPatients(pt)});
 if(adm)h+='<div class="dash-sec">Finance \u2014 '+(fn?E(fn.label):'this month')+'</div>'+sect('Finance',function(){return secFinance(fn)});
 h+='<div class="dash-sec">Inventory alerts</div>'+sect('Inventory alerts',function(){return secInv(iv)});
 var nt=[];
 if(SK.appt)nt.push(SK.appt+' appointment(s) with a missing or invalid date were skipped');
 if(pt){if(pt.visBad)nt.push(pt.visBad+' visit(s) with a missing or invalid Visit Date were excluded');if(pt.visFut)nt.push(pt.visFut+' future-dated visit(s) were not counted');if(!pt.visOk)nt.push('Visits This Month is hidden because no visit has a valid date')}
 if(SK.fin)nt.push(SK.fin+' finance record(s) with a missing or invalid date are excluded from period figures (payables and outstanding balances still include them)');
 h+='<div class="dash-note">Calculated at '+new Date().toTimeString().slice(0,5)+' from this browser\u2019s storage. Figures follow the Finance and Patient Management rules. Archived records are excluded.'+(nt.length?'<br>\u26a0 '+nt.map(E).join('<br>\u26a0 '):'')+'</div>';
 root.innerHTML=h}
function render(){var root=$d('dashRoot');if(!root||dashReloading)return;
 try{if(roleDrift()){dashReload();return}}catch(e){}
 SK={};dashDay=td();
 try{renderInner(root)}catch(e){try{console.error('Dashboard failed:',e)}catch(x){}root.innerHTML='<div class="cd"><div class="dash-empty">Unavailable \u2014 the Dashboard could not be displayed. Try Refresh.</div></div>'}}
document.addEventListener('DOMContentLoaded',render);
function dashOnStorage(e){var k=e.key;if(!k||k==='pwSession'||k==='pwRolePerms'||Object.prototype.hasOwnProperty.call(DASH_KEYS,k))render()}

setInterval(function(){if(!document.hidden&&(td()!==dashDay||roleDrift()))render()},60000);
